name: Lyrius 1.0.137 Bend Inspect
on:
  push:
    branches: [build-1.0.137]
    paths:
      - '.github/workflows/lyrius-bend137-inspect.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Download current
        run: |
          curl -fL 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-2c88-820e-b54d-08d99f4193d2/raw?se=2026-09-20T22%3A42%3A26Z&sp=r&sv=2026-02-06&sr=b&scid=fc09ebe0-f344-566d-a325-e4c4d0d6af10&skoid=127c13cb-e695-43ea-b6b2-0a863d41dbf7&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-20T18%3A31%3A15Z&ske=2026-09-21T18%3A31%3A15Z&sks=b&skv=2026-02-06&sig=HBhl%2BoV3SY9czKk8YRHypCMTfv7LWlzm4hxt1Bl203I%3D' -o current.jar
          unzip -q current.jar -d current
          curl -fL https://www.benf.org/other/cfr/cfr-0.152.jar -o cfr.jar
      - name: Decompile bend subsystem
        run: |
          set -e
          mkdir -p out
          for c in \
            br/com/lyrius/cpmemote/BendEntityScope.class \
            br/com/lyrius/cpmemote/BendRenderContext.class \
            br/com/lyrius/cpmemote/PlayerModelBendCapture.class \
            br/com/lyrius/cpmemote/CPMEmotecraftBendCompat.class \
            br/com/lyrius/cpmemote/sg8/RenderScopedBendSnapshot.class \
            br/com/lyrius/cpmemote/sg8/ThreadLocalVanillaBendRegistry.class \
            br/com/lyrius/cpmemote/mixin/PlayerModelBendCaptureMixin.class \
            br/com/lyrius/cpmemote/mixin/ModelPartBendMixin.class \
            br/com/lyrius/cpmemote/mixin/InventoryScreenPreviewGuardMixin.class; do
            if [ -f "current/$c" ]; then java -jar cfr.jar "current/$c" --outputdir out --silent true; fi
          done
          echo '=== CPM MIXIN CONFIG ==='
          cat current/lyriusrpmodplugin.cpm_emotecraft_bend_compat.mixins.json
          echo '=== SOURCES ==='
          find out -name '*.java' -print | sort | while read f; do echo "----- $f -----"; cat "$f"; done
