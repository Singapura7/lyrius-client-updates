name: Lyrius 1.0.137 CoreUI Inspect
on:
  push:
    branches: [build-1.0.137]
    paths:
      - '.github/workflows/lyrius-137-coreui-inspect.yml'
permissions:
  actions: read
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v4
        with:
          name: lyrius-137-audit
          path: audit
          github-token: ${{ github.token }}
          repository: Singapura7/lyrius-client-updates
          run-id: '35542271338'
      - name: Decompile core UI
        shell: bash
        run: |
          set -e
          curl -fL https://www.benf.org/other/cfr/cfr-0.152.jar -o cfr.jar
          rm -rf out && mkdir out
          for c in LyriusExperienceColorMixin LyriusSplashLogoMixin LyriusGuiTextureRouterMixin GenericContainerThemeMixin; do
            f="audit/current/com/lyrius/client/mixin/$c.class"
            if [ -f "$f" ]; then java -jar cfr.jar "$f" --outputdir out --silent true; fi
          done
          echo '=== CLIENT MIXINS ==='; cat audit/current/lyriusclient.client.mixins.json
          echo '=== CORE MIXINS ==='; cat audit/current/lyriusclient.coreui.mixins.json
          echo '=== LOGO ASSETS ==='; find audit/current/assets -type f | grep -Ei 'logo|mojang|splash' | head -100 || true
          echo '=== SOURCES ==='
          find out -name '*.java' -print | sort | while read f; do echo "===== $f ====="; cat "$f"; done
