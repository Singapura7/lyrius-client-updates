name: Lyrius 1.0.138 Baseline Inspect
on:
  push:
    branches: [build-1.0.137]
    paths:
      - '.github/workflows/lyrius-138-baseline.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Download
        shell: bash
        run: |
          set -euo pipefail
          curl -fL 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-df40-820e-b585-c25d279450eb/raw?se=2026-09-21T00%3A36%3A37Z&sp=r&sv=2026-02-06&sr=b&scid=efd9f4b5-8459-51b0-a21f-402ed087ac02&skoid=127c13cb-e695-43ea-b6b2-0a863d41dbf7&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-20T11%3A24%3A32Z&ske=2026-09-21T11%3A24%3A32Z&sks=b&skv=2026-02-06&sig=vC8aUJbesNdMA1RGb934tGyaUKOdIyGxrUJ2vm/0jgs%3D' -o ia120.zip
          curl -fL 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-c2f4-820e-95fd-3636ff665f3d/raw?se=2026-09-21T00%3A36%3A41Z&sp=r&sv=2026-02-06&sr=b&scid=02142fb7-1254-5b62-81f1-71efff70925b&skoid=127c13cb-e695-43ea-b6b2-0a863d41dbf7&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-20T11%3A56%3A35Z&ske=2026-09-21T11%3A56%3A35Z&sks=b&skv=2026-02-06&sig=eTRyHD59N3%2B86MFYaaRDsjrb55wY4q%2BILcoxWePAAvY%3D' -o staff120.jar
          mkdir ia120 s120
          unzip -q ia120.zip -d ia120
          unzip -q staff120.jar -d s120
      - name: Inspect
        shell: bash
        run: |
          {
            echo '=== IA120 FILES ==='
            find ia120 -type f -printf '%P\n' | sort
            echo '=== IA120 EXCALIBUR FILES ==='
            find ia120 -type f | grep -i 'Lyrius_Excalibur' | sort || true
            echo '=== STAFF120 MIXINS ==='
            cat s120/lyriusclient.client.mixins.json || true
            cat s120/lyriusclient.coreui.mixins.json || true
            echo '=== STAFF120 fabric ==='
            cat s120/fabric.mod.json
            echo '=== STAFF120 relevant ==='
            find s120/com/lyrius/client/mixin -maxdepth 1 -type f -printf '%f\n' | sort | grep -E 'Experience|Splash|GenericContainer|SelectiveImmersive'
          } | tee report.txt
      - uses: actions/upload-artifact@v4
        with:
          name: lyrius-138-baseline
          path: report.txt
