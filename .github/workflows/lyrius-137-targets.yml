name: Lyrius 1.0.137 Minecraft Targets
on:
  push:
    branches: [build-1.0.137]
    paths:
      - '.github/workflows/lyrius-137-targets.yml'
jobs:
  targets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Download Minecraft 1.21.4 client
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, urllib.request
          manifest=json.load(urllib.request.urlopen('https://piston-meta.mojang.com/mc/game/version_manifest_v2.json'))
          v=next(x for x in manifest['versions'] if x['id']=='1.21.4')
          meta=json.load(urllib.request.urlopen(v['url']))
          url=meta['downloads']['client']['url']
          urllib.request.urlretrieve(url,'minecraft-client.jar')
          print(url)
          PY
          curl -fL https://www.benf.org/other/cfr/cfr-0.152.jar -o cfr.jar
      - name: Inspect targets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          # official names in 1.21.4: InGameHud=foe, SplashOverlay=fuc
          unzip -p minecraft-client.jar foe.class > foe.class
          unzip -p minecraft-client.jar fuc.class > fuc.class
          java -jar cfr.jar foe.class --outputdir out --silent true || true
          java -jar cfr.jar fuc.class --outputdir out --silent true || true
          javap -p -c -constants -classpath minecraft-client.jar foe > InGameHud.javap.txt
          javap -p -c -constants -classpath minecraft-client.jar fuc > SplashOverlay.javap.txt
          echo '=== EXPERIENCE CONSTANTS / METHOD ==='
          grep -n -A120 -B10 -E '8453920|8323296|experience|method_56136| ldc +#.*(8453920|-8323296)' InGameHud.javap.txt || true
          echo '=== SPLASH LOGO ==='
          grep -n -A120 -B10 -E 'logo|mojang|field_2483|method_25394' SplashOverlay.javap.txt || true
          echo '=== CFR EXPERIENCE HINTS ==='
          grep -Rni -A30 -B10 -E '8453920|0x80ff20|experienceLevel' out || true
          echo '=== CFR SPLASH HINTS ==='
          grep -Rni -A30 -B10 -E 'mojang|logo' out || true
      - uses: actions/upload-artifact@v4
        with:
          name: lyrius-137-targets
          path: |
            out
            InGameHud.javap.txt
            SplashOverlay.javap.txt
