name: Lyrius 1.0.138 Inspect
on:
  push:
    branches: [build-1.0.137]
    paths:
      - '.github/workflows/lyrius-138-inspect.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download inputs
        shell: bash
        run: |
          set -euo pipefail
          curl -fL 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-49d0-820e-8acd-b98b701bf5b9/raw?se=2026-09-21T00%3A30%3A51Z&sp=r&sv=2026-02-06&sr=b&scid=c5fffd01-f110-504b-90cc-14f668851f75&skoid=127c13cb-e695-43ea-b6b2-0a863d41dbf7&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-20T18%3A21%3A41Z&ske=2026-09-21T18%3A21%3A41Z&sks=b&skv=2026-02-06&sig=IdU9z5NbD6ftTNiWmtCz1KOsRzTvrcP8Ptm8%2B7ZNueo%3D' -o pkg137.zip
          curl -fL 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-15e0-820e-9d2e-becb050946e2/raw?se=2026-09-21T00%3A30%3A18Z&sp=r&sv=2026-02-06&sr=b&scid=217b9748-557c-593b-9d1a-51dce1cb761e&skoid=127c13cb-e695-43ea-b6b2-0a863d41dbf7&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-20T09%3A55%3A39Z&ske=2026-09-21T09%3A55%3A39Z&sks=b&skv=2026-02-06&sig=n74rWPgodhCtRGpFsGR2GUcMAUM3zpqFWKVlhKRAGoY%3D' -o merge128.zip
          curl -fL 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-cf18-820e-a44d-10ab4d5944d2/raw?se=2026-09-21T00%3A30%3A57Z&sp=r&sv=2026-02-06&sr=b&scid=555596c0-0f87-56b6-a6b5-a03281983f95&skoid=127c13cb-e695-43ea-b6b2-0a863d41dbf7&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-20T13%3A23%3A32Z&ske=2026-09-21T13%3A23%3A32Z&sks=b&skv=2026-02-06&sig=1v/fKwNiHv5Px4GbhAeV9MhwtlpjfYpKdTLJIJMARgY%3D' -o staff128.jar
      - name: Inspect
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/pkg out/m128 out/s128
          unzip -q pkg137.zip -d out/pkg
          unzip -q merge128.zip -d out/m128
          unzip -q staff128.jar -d out/s128
          {
            echo '=== PKG137 ==='; find out/pkg -maxdepth 4 -type f -printf '%P\n' | sort
            echo '=== MERGE128 ==='; find out/m128 -type f -printf '%P\n' | sort
            echo '=== EXCALIBUR 137 MERGES ==='
            find out/pkg -type f | grep -Ei 'itemsadder|excalibur|safe-merge' | sort || true
            echo '=== 128 CORE UI ==='
            cat out/s128/lyriusclient.coreui.mixins.json 2>/dev/null || true
            cat out/s128/lyriusclient.client.mixins.json 2>/dev/null || true
            echo '=== 128 RELEVANT CLASSES ==='
            find out/s128/com/lyrius/client/mixin -type f -maxdepth 1 -printf '%f\n' | sort | grep -E 'Experience|Splash|GenericContainer|GuiTexture|Hotbar' || true
          } > out/report.txt
          cat out/report.txt
      - uses: actions/upload-artifact@v4
        with:
          name: lyrius-138-inspect
          path: out/report.txt
