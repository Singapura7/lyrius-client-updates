name: Lyrius 1.0.137 Bend Inspect From Audit
on:
  push:
    branches: [build-1.0.137]
    paths:
      - '.github/workflows/lyrius-bend137-from-audit.yml'
permissions:
  actions: read
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v4
        with:
          name: lyrius-137-audit
          path: audit-artifact
          github-token: ${{ github.token }}
          repository: Singapura7/lyrius-client-updates
          run-id: '35542271338'
      - name: Decompile and show bend sources
        shell: bash
        run: |
          set -e
          curl -fL https://www.benf.org/other/cfr/cfr-0.152.jar -o cfr.jar
          rm -rf bend-src && mkdir bend-src
          for c in \
            br/com/lyrius/cpmemote/BendEntityScope.class \
            br/com/lyrius/cpmemote/BendRenderContext.class \
            br/com/lyrius/cpmemote/PlayerModelBendCapture.class \
            br/com/lyrius/cpmemote/CPMEmotecraftBendCompat.class \
            br/com/lyrius/cpmemote/sg8/RenderScopedBendSnapshot.class \
            br/com/lyrius/cpmemote/sg8/ThreadLocalVanillaBendRegistry.class \
            br/com/lyrius/cpmemote/mixin/PlayerModelBendCaptureMixin.class \
            br/com/lyrius/cpmemote/mixin/ModelPartBendMixin.class \
            br/com/lyrius/cpmemote/mixin/InventoryScreenPreviewGuardMixin.class; do
            if [ -f "audit-artifact/current/$c" ]; then
              java -jar cfr.jar "audit-artifact/current/$c" --outputdir bend-src --silent true
            fi
          done
          echo '=== CPM MIXIN CONFIG ==='
          cat audit-artifact/current/lyriusrpmodplugin.cpm_emotecraft_bend_compat.mixins.json
          echo '=== BEND SOURCES ==='
          find bend-src -name '*.java' -print | sort | while read f; do echo "===== $f ====="; cat "$f"; done
