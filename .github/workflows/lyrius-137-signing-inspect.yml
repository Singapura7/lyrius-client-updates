name: Lyrius 1.0.137 Inspect Signing Source
on:
  push:
    branches: [build-1.0.137]
    paths:
      - '.github/workflows/lyrius-137-signing-inspect.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect old final archive
        shell: bash
        run: |
          set -euo pipefail
          curl -fL 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-94f8-820e-bcfc-ee672459fc60/raw?se=2026-09-20T23%3A51%3A05Z&sp=r&sv=2026-02-06&sr=b&scid=9be706df-6d38-5f46-94ea-20fb31667573&skoid=127c13cb-e695-43ea-b6b2-0a863d41dbf7&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-20T12%3A24%3A42Z&ske=2026-09-21T12%3A24%3A42Z&sks=b&skv=2026-02-06&sig=kkNxXHE%2BaiKjzEbmyUIgeV8YsTfeljcFffNF7PSPrkw%3D' -o old.zip
          echo '=== likely signing/private entries ==='
          unzip -Z1 old.zip | grep -Ei 'p12|pfx|keystore|private|privado|sign|cert|1\.0\.17' || true
          echo '=== top-level ==='
          unzip -Z1 old.zip | head -120
