name: Build Lyrius 1.0.137 Final Candidate
on:
  push:
    branches: [build-1.0.137]
    paths:
      - '.github/workflows/lyrius-137-final-build.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Download authoritative inputs
        shell: bash
        run: |
          set -euo pipefail
          curl -fL 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-b6d0-820e-8207-1381d6316f24/raw?se=2026-09-20T23%3A54%3A14Z&sp=r&sv=2026-02-06&sr=b&scid=2e5d837d-6215-50d0-98a5-12da4ce95f32&skoid=127c13cb-e695-43ea-b6b2-0a863d41dbf7&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-20T21%3A57%3A31Z&ske=2026-09-21T21%3A57%3A31Z&sks=b&skv=2026-02-06&sig=G0nuacdWiJ2bAOf7HOGaBen1FiNAO%2BkegEszjSr5f%2Bk%3D' -o staff136.jar
          curl -fL 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-8148-820e-90d0-6905967be218/raw?se=2026-09-20T23%3A54%3A19Z&sp=r&sv=2026-02-06&sr=b&scid=691c24e3-9a08-5eb7-a919-cfff0c959552&skoid=127c13cb-e695-43ea-b6b2-0a863d41dbf7&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-20T21%3A57%3A31Z&ske=2026-09-21T21%3A57%3A31Z&sks=b&skv=2026-02-06&sig=oyOhI4vPjac6B7KJkdNDh0Q7SuNhDZuT00CWtecf7WU%3D' -o players136.jar
          curl -fL 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-7f34-820e-a48a-aa29d5512e6f/raw?se=2026-09-20T23%3A54%3A22Z&sp=r&sv=2026-02-06&sr=b&scid=4782f28d-bed5-584e-b9ac-68e3698d46cf&skoid=127c13cb-e695-43ea-b6b2-0a863d41dbf7&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-20T21%3A57%3A31Z&ske=2026-09-21T21%3A57%3A31Z&sks=b&skv=2026-02-06&sig=PyQcnqKFvbxIu/ZKRvrBXvgR5qJ25kxojBQ102xwSx8%3D' -o reputation118.jar
          curl -fL 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-f848-820e-979a-15d178aece06/raw?se=2026-09-20T23%3A54%3A25Z&sp=r&sv=2026-02-06&sr=b&scid=aa8779ba-6074-5ed6-9dc8-07d1438218ab&skoid=127c13cb-e695-43ea-b6b2-0a863d41dbf7&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-20T21%3A12%3A52Z&ske=2026-09-21T21%3A12%3A52Z&sks=b&skv=2026-02-06&sig=BpU7Fx4ueIU/RvucpbgQ2rsEK9eonF7fApUF7/QdjeQ%3D' -o servermerge118.zip
          curl -fL 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-e228-820e-a765-56cc9911bc31/raw?se=2026-09-20T23%3A54%3A27Z&sp=r&sv=2026-02-06&sr=b&scid=33be48b8-307f-5d98-8d0f-7ca3a3574066&skoid=127c13cb-e695-43ea-b6b2-0a863d41dbf7&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-20T13%3A59%3A40Z&ske=2026-09-21T13%3A59%3A40Z&sks=b&skv=2026-02-06&sig=1A5T/trOB4o8TOJfP5ld4d4sjckBrRGgzWae/D7ljJ8%3D' -o iasafe135.zip
          sha256sum staff136.jar players136.jar reputation118.jar servermerge118.zip iasafe135.zip
          unzip -t staff136.jar >/dev/null
          unzip -t players136.jar >/dev/null
          unzip -t reputation118.jar >/dev/null
          unzip -t servermerge118.zip >/dev/null
          unzip -t iasafe135.zip >/dev/null

      - name: Prepare tools
        shell: bash
        run: |
          set -euo pipefail
          curl -fL https://repo1.maven.org/maven2/org/ow2/asm/asm/9.7.1/asm-9.7.1.jar -o asm.jar
          python3 -m pip install --quiet pillow
          git clone --depth 1 https://github.com/Shrimpsnail/Immersive-Interfaces.git immersive

      - name: Build client patches
        shell: bash
        run: |
          set -euo pipefail
          cat > Patcher.java <<'JAVA'
          import org.objectweb.asm.*;
          import java.nio.file.*;
          public class Patcher implements Opcodes {
            static byte[] patchModelPart(byte[] in) {
              ClassReader cr=new ClassReader(in); ClassWriter cw=new ClassWriter(cr,0);
              cr.accept(new ClassVisitor(ASM9,cw){
                public MethodVisitor visitMethod(int a,String n,String d,String s,String[] e){
                  MethodVisitor mv=super.visitMethod(a,n,d,s,e);
                  return new MethodVisitor(ASM9,mv){
                    public void visitMethodInsn(int op,String owner,String name,String desc,boolean itf){
                      if(owner.equals("br/com/lyrius/cpmemote/sg8/ThreadLocalVanillaBendRegistry") &&
                         name.equals("peek") && desc.equals("(Ljava/lang/Object;)Lbr/com/lyrius/cpmemote/BendState;")) name="take";
                      super.visitMethodInsn(op,owner,name,desc,itf);
                    }
                  };
                }
              },0); return cw.toByteArray();
            }
            static byte[] cleanupMixin(){
              ClassWriter cw=new ClassWriter(ClassWriter.COMPUTE_FRAMES|ClassWriter.COMPUTE_MAXS);
              String cn="br/com/lyrius/cpmemote/mixin/PlayerRenderBendCleanupMixin";
              cw.visit(V21,ACC_PUBLIC|ACC_ABSTRACT,cn,null,"java/lang/Object",null);
              AnnotationVisitor mx=cw.visitAnnotation("Lorg/spongepowered/asm/mixin/Mixin;",false);
              AnnotationVisitor ar=mx.visitArray("targets"); ar.visit(null,"net.minecraft.class_922"); ar.visitEnd();
              mx.visit("remap",false); mx.visit("priority",450); mx.visitEnd();
              MethodVisitor mv=cw.visitMethod(ACC_PRIVATE,"lyrius$clearBendAfterPlayerRender",
                "(Lnet/minecraft/class_10042;Lnet/minecraft/class_4587;Lnet/minecraft/class_4597;ILorg/spongepowered/asm/mixin/injection/callback/CallbackInfo;)V",null,null);
              AnnotationVisitor inj=mv.visitAnnotation("Lorg/spongepowered/asm/mixin/injection/Inject;",false);
              AnnotationVisitor methods=inj.visitArray("method");
              methods.visit(null,"method_4054(Lnet/minecraft/class_10042;Lnet/minecraft/class_4587;Lnet/minecraft/class_4597;I)V"); methods.visitEnd();
              AnnotationVisitor at=inj.visitAnnotation("at","Lorg/spongepowered/asm/mixin/injection/At;");
              at.visit("value","TAIL"); at.visitEnd(); inj.visit("require",1); inj.visit("remap",false); inj.visitEnd();
              mv.visitCode();
              Label done=new Label();
              mv.visitVarInsn(ALOAD,1);
              mv.visitTypeInsn(INSTANCEOF,"net/minecraft/class_10055");
              mv.visitJumpInsn(IFEQ,done);
              mv.visitInsn(ACONST_NULL); mv.visitInsn(ACONST_NULL);
              mv.visitMethodInsn(INVOKESTATIC,"br/com/lyrius/cpmemote/BendEntityScope","capture","(Ljava/lang/Object;Ljava/lang/Object;)V",false);
              mv.visitMethodInsn(INVOKESTATIC,"br/com/lyrius/cpmemote/sg8/ThreadLocalVanillaBendRegistry","clearFrame","()V",false);
              mv.visitLabel(done); mv.visitInsn(RETURN); mv.visitMaxs(0,0); mv.visitEnd();
              cw.visitEnd(); return cw.toByteArray();
            }
            static byte[] xpMixin(){
              ClassWriter cw=new ClassWriter(ClassWriter.COMPUTE_FRAMES|ClassWriter.COMPUTE_MAXS);
              String cn="com/lyrius/client/mixin/LyriusExperienceColor137Mixin";
              cw.visit(V21,ACC_PUBLIC|ACC_ABSTRACT,cn,null,"java/lang/Object",null);
              AnnotationVisitor mx=cw.visitAnnotation("Lorg/spongepowered/asm/mixin/Mixin;",false);
              AnnotationVisitor val=mx.visitArray("value"); val.visit(null,Type.getType("Lnet/minecraft/class_329;")); val.visitEnd();
              mx.visit("remap",false); mx.visit("priority",2000); mx.visitEnd();
              MethodVisitor mv=cw.visitMethod(ACC_PRIVATE,"lyrius$cyanExperience","(I)I",null,null);
              AnnotationVisitor mod=mv.visitAnnotation("Lorg/spongepowered/asm/mixin/injection/ModifyConstant;",false);
              AnnotationVisitor methods=mod.visitArray("method");
              methods.visit(null,"method_56136(Lnet/minecraft/class_332;Lnet/minecraft/class_9779;)V"); methods.visitEnd();
              AnnotationVisitor constant=mod.visitAnnotation("constant","Lorg/spongepowered/asm/mixin/injection/Constant;");
              constant.visit("intValue",8453920); constant.visitEnd();
              mod.visit("require",1); mod.visit("remap",false); mod.visitEnd();
              mv.visitCode(); mv.visitLdcInsn(0xFF35C4D5); mv.visitInsn(IRETURN); mv.visitMaxs(0,0); mv.visitEnd();
              cw.visitEnd(); return cw.toByteArray();
            }
            public static void main(String[] args) throws Exception{
              Path root=Path.of(args[0]);
              Path mp=root.resolve("br/com/lyrius/cpmemote/mixin/ModelPartBendMixin.class");
              Files.write(mp,patchModelPart(Files.readAllBytes(mp)));
              Files.write(root.resolve("br/com/lyrius/cpmemote/mixin/PlayerRenderBendCleanupMixin.class"),cleanupMixin());
              Files.write(root.resolve("com/lyrius/client/mixin/LyriusExperienceColor137Mixin.class"),xpMixin());
            }
          }
          JAVA
          javac -cp asm.jar Patcher.java
          for profile in staff players; do
            mkdir -p "work/$profile"
            unzip -q "${profile}136.jar" -d "work/$profile"
            rm -f "work/$profile"/META-INF/*.SF "work/$profile"/META-INF/*.RSA "work/$profile"/META-INF/*.DSA "work/$profile"/META-INF/*.EC
            java -cp .:asm.jar Patcher "work/$profile"
            PROFILE="$profile" python3 - <<'PY'
          import os,json,pathlib
          root=pathlib.Path("work")/os.environ["PROFILE"]
          # same-length release bump in all textual/binary constants
          for p in root.rglob("*"):
              if not p.is_file(): continue
              b=p.read_bytes()
              if b"1.0.136" in b:
                  p.write_bytes(b.replace(b"1.0.136",b"1.0.137"))
          # remove dead/competing generic GUI hook
          p=root/"lyriusclient.client.mixins.json"; d=json.loads(p.read_text())
          d["client"]=[x for x in d.get("client",[]) if x!="GenericContainerScreenMixin"]
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+"\n")
          # one core owner: no client-side Immersive router; robust XP hook
          p=root/"lyriusclient.coreui.mixins.json"; d=json.loads(p.read_text())
          d["client"]=[x for x in d.get("client",[]) if x not in ("LyriusGuiTextureRouterMixin","LyriusExperienceColorMixin")]
          pos=d["client"].index("LyriusHotbarSelectionMixin")+1 if "LyriusHotbarSelectionMixin" in d["client"] else 0
          d["client"].insert(pos,"LyriusExperienceColor137Mixin")
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+"\n")
          # register render-tail cleanup
          p=root/"lyriusrpmodplugin.cpm_emotecraft_bend_compat.mixins.json"; d=json.loads(p.read_text())
          if "PlayerRenderBendCleanupMixin" not in d["client"]: d["client"].append("PlayerRenderBendCleanupMixin")
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+"\n")
          # fabric metadata
          p=root/"fabric.mod.json"; d=json.loads(p.read_text())
          d["version"]="1.0.137"
          d["description"]="Lyrius RP Made It 1.0.137: Core UI consolidado, XP cyan, splash Lyrius restaurado e bend CPM/Emotecraft isolado por render. Immersive Interfaces 1.21.4 é aplicado pelo SAFE MERGE do ItemsAdder."
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+"\n")
          # diagnostics text
          for rel in ["com/lyrius/client/mixin/GenericContainerThemeMixin.class","com/lyrius/client/mixin/LyriusSplashLogoMixin.class"]:
              q=root/rel
              if q.exists(): q.write_bytes(q.read_bytes().replace(b"/136]",b"/137]"))
          PY
          done

      - name: Restore splash resources and cyan XP bar
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,urllib.request,zipfile,io,os,pathlib
          from PIL import Image
          # get vanilla XP progress sprite
          manifest=json.load(urllib.request.urlopen('https://piston-meta.mojang.com/mc/game/version_manifest_v2.json'))
          v=next(x for x in manifest['versions'] if x['id']=='1.21.4')
          meta=json.load(urllib.request.urlopen(v['url']))
          urllib.request.urlretrieve(meta['downloads']['client']['url'],'mc.jar')
          with zipfile.ZipFile('mc.jar') as z:
              raw=z.read('assets/minecraft/textures/gui/sprites/hud/experience_bar_progress.png')
          img=Image.open(io.BytesIO(raw)).convert('RGBA')
          px=img.load()
          for y in range(img.height):
              for x in range(img.width):
                  r,g,b,a=px[x,y]
                  if a:
                      lum=max(r,g,b)/255.0
                      px[x,y]=(int(53*lum),int(196*lum),int(213*lum),a)
          for profile in ('staff','players'):
              root=pathlib.Path('work')/profile
              out=root/'assets/minecraft/textures/gui/sprites/hud/experience_bar_progress.png'
              out.parent.mkdir(parents=True,exist_ok=True); img.save(out)
              # create a 2:1 splash texture from the approved Lyrius pause logo
              src=root/'assets/lyriusrpmodplugin/textures/gui/pause/lyrius_logo_trimmed.png'
              if not src.exists(): src=root/'assets/lyriusrpmodplugin/textures/gui/title/serverlogo.png'
              logo=Image.open(src).convert('RGBA')
              canvas=Image.new('RGBA',(512,256),(0,0,0,0))
              logo.thumbnail((430,190),Image.Resampling.LANCZOS)
              canvas.alpha_composite(logo,((512-logo.width)//2,(256-logo.height)//2))
              for target in [
                  root/'assets/lyriusrpmodplugin/textures/gui/title/lyrius.png',
                  root/'assets/minecraft/textures/gui/title/mojangstudios.png'
              ]:
                  target.parent.mkdir(parents=True,exist_ok=True); canvas.save(target)
          PY

      - name: Build ItemsAdder Immersive safe merge
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ia && mkdir ia && unzip -q iasafe135.zip -d ia
          EX=$(find ia -type d -name 'Lyrius_Excalibur' -print -quit)
          if [ -z "$EX" ]; then echo "Lyrius_Excalibur not found"; find ia -maxdepth 5 -type d; exit 1; fi
          RP="$EX/resourcepack"
          mkdir -p "$RP/assets/minecraft"
          # Dedicated backgrounds only. Intentionally exclude generic_54, horse, villager/trades.
          for f in anvil beacon blast_furnace brewing_stand cartography_table crafter crafting_table dispenser enchanting_table furnace grindstone hopper inventory loom shulker_box smithing smoker stonecutter; do
            src="immersive/assets/minecraft/textures/gui/container/$f.png"
            if [ -f "$src" ]; then mkdir -p "$RP/assets/minecraft/textures/gui/container"; cp "$src" "$RP/assets/minecraft/textures/gui/container/"; fi
          done
          # Dedicated sprites, with global/chest/merchant surfaces excluded.
          mkdir -p "$RP/assets/minecraft/textures/gui/sprites/container"
          for d in anvil beacon blast_furnace brewing_stand bundle cartography_table crafter enchanting_table furnace loom smoker stonecutter; do
            if [ -d "immersive/assets/minecraft/textures/gui/sprites/container/$d" ]; then
              cp -a "immersive/assets/minecraft/textures/gui/sprites/container/$d" "$RP/assets/minecraft/textures/gui/sprites/container/"
            fi
          done
          mkdir -p "$RP/assets/minecraft/textures/gui/sprites/recipe_book"
          cp -a immersive/assets/minecraft/textures/gui/sprites/recipe_book/. "$RP/assets/minecraft/textures/gui/sprites/recipe_book/" || true
          [ -f immersive/assets/minecraft/textures/gui/recipe_book.png ] && cp immersive/assets/minecraft/textures/gui/recipe_book.png "$RP/assets/minecraft/textures/gui/"
          # Materialize Immersive shader overlays for MC 1.21.4.
          mkdir -p "$RP/assets/minecraft/shaders"
          cp -a immersive/assets/minecraft/shaders/. "$RP/assets/minecraft/shaders/"
          for overlay in _1.20.2_shaders _1.21.1_shader_fix _1.21.2-.4_json_fix; do
            if [ -d "immersive/$overlay/assets/minecraft/shaders" ]; then
              cp -a "immersive/$overlay/assets/minecraft/shaders/." "$RP/assets/minecraft/shaders/"
            fi
          done
          # XP only: cyan bar in server pack, no other HUD from Immersive.
          mkdir -p "$RP/assets/minecraft/textures/gui/sprites/hud"
          cp work/players/assets/minecraft/textures/gui/sprites/hud/experience_bar_progress.png "$RP/assets/minecraft/textures/gui/sprites/hud/"
          cat > "$EX/LYRIUS-1.0.137-IMMERSIVE-README.txt" <<'EOF'
          Lyrius 1.0.137 / Minecraft 1.21.4
          SAFE MERGE: não apaga namespaces existentes.
          Inclui Immersive Interfaces apenas nas telas dedicadas.
          Excluídos de propósito: generic_54/chests, horse, villager/trades e HUD global.
          O único HUD incluído é experience_bar_progress cyan.
          EOF
          (cd ia && zip -qr ../LYRIUS-ITEMSADDER-1.0.137-REPUTATION-EXCALIBUR-IMMERSIVE-1.21.4-SAFE-MERGE.zip .)

      - name: Validate and package client jars
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/client dist/server dist/itemsadder dist/docs dist/source
          for profile in staff players; do
            # remove old signature manifest digests by recreating jar from layout
            rm -f work/$profile/META-INF/MANIFEST.MF
            out="dist/client/Lyrius-RP-Made-It-1.0.137-$(echo $profile | tr a-z A-Z)-UNSIGNED.jar"
            (cd work/$profile && jar --create --file "../../$out" .)
            unzip -t "$out" >/dev/null
          done
          cp reputation118.jar dist/server/LyriusReputation-0.15.2-1.0.118-FINAL.jar
          cp servermerge118.zip dist/server/LYRIUS-SERVER-REPUTATION-1.0.118-HOBBIES-FINAL-MERGE.zip
          cp LYRIUS-ITEMSADDER-1.0.137-REPUTATION-EXCALIBUR-IMMERSIVE-1.21.4-SAFE-MERGE.zip dist/itemsadder/

          # Sign with a recovery release certificate because the historical private key is intentionally absent from accessible artifacts.
          PASS='Lyrius137-Recovery-Internal'
          keytool -genkeypair -alias lyrius-release-137 -keyalg RSA -keysize 3072 -sigalg SHA384withRSA -validity 3650 \
            -dname "CN=Lyrius RP Made It Release 1.0.137 Recovery, OU=Lyrius RP, O=Lyrius RP, L=Brazil, C=BR" \
            -storetype PKCS12 -keystore recovery-137.p12 -storepass "$PASS" -keypass "$PASS" >/dev/null 2>&1
          for profile in STAFF PLAYERS; do
            in="dist/client/Lyrius-RP-Made-It-1.0.137-$profile-UNSIGNED.jar"
            out="dist/client/Lyrius-RP-Made-It-1.0.137-$profile-SIGNED-RC.jar"
            cp "$in" "$out"
            jarsigner -keystore recovery-137.p12 -storetype PKCS12 -storepass "$PASS" -keypass "$PASS" \
              -sigalg SHA384withRSA -digestalg SHA-384 "$out" lyrius-release-137 >/dev/null
            jarsigner -verify "$out" > "dist/docs/JARSIGNER-$profile.txt" 2>&1
          done
          keytool -exportcert -rfc -alias lyrius-release-137 -keystore recovery-137.p12 -storetype PKCS12 -storepass "$PASS" > dist/docs/lyrius-release-1.0.137-recovery-public.pem
          keytool -list -v -alias lyrius-release-137 -keystore recovery-137.p12 -storetype PKCS12 -storepass "$PASS" | grep -E 'SHA256:|Owner:|Valid from:' > dist/docs/ASSINATURA-RECOVERY.txt
          rm -f recovery-137.p12

          # hard regression gates
          python3 - <<'PY'
          import zipfile,json,pathlib,hashlib,sys
          def h(b): return hashlib.sha256(b).hexdigest()
          base=zipfile.ZipFile('staff136.jar')
          new=zipfile.ZipFile('dist/client/Lyrius-RP-Made-It-1.0.137-STAFF-SIGNED-RC.jar')
          frozen=[
            'com/lyrius/client/mixin/LyriusHotbarSelectionMixin.class',
            'META-INF/jars/lyriusrpmod-1.21.4-0.3.17.jar',
          ]
          frozen += [n for n in base.namelist() if n.startswith('com/lyrius/client/pause/') and n.endswith('.class')]
          frozen += [n for n in base.namelist() if n.startswith('com/lyrius/client/crimsonrain/') and n.endswith('.class')]
          frozen += [n for n in base.namelist() if n.startswith('com/lyrius/client/grimorio/') and n.endswith('.class')]
          frozen += [n for n in base.namelist() if n.startswith('com/lyrius/client/visual/') and n.endswith('.class')]
          bad=[]
          for n in sorted(set(frozen)):
            if n not in new.namelist() or h(base.read(n))!=h(new.read(n)): bad.append(n)
          if bad:
            print('FROZEN REGRESSION:',*bad,sep='\n'); sys.exit(2)
          # Every configured mixin must exist.
          for jarpath in ['dist/client/Lyrius-RP-Made-It-1.0.137-STAFF-SIGNED-RC.jar','dist/client/Lyrius-RP-Made-It-1.0.137-PLAYERS-SIGNED-RC.jar']:
            with zipfile.ZipFile(jarpath) as z:
              names=set(z.namelist())
              fm=json.loads(z.read('fabric.mod.json'))
              assert fm['version']=='1.0.137'
              for cfg in fm.get('mixins',[]):
                d=json.loads(z.read(cfg)); pkg=d.get('package','')
                for sec in ('mixins','client','server'):
                  for c in d.get(sec,[]) or []:
                    p=(pkg+'.'+c).replace('.','/')+'.class'
                    if p not in names: raise SystemExit(f'MISSING MIXIN {cfg}: {p}')
              assert 'GenericContainerScreenMixin' not in z.read('lyriusclient.client.mixins.json').decode()
              assert 'LyriusGuiTextureRouterMixin' not in z.read('lyriusclient.coreui.mixins.json').decode()
              assert 'LyriusExperienceColor137Mixin' in z.read('lyriusclient.coreui.mixins.json').decode()
              assert 'PlayerRenderBendCleanupMixin' in z.read('lyriusrpmodplugin.cpm_emotecraft_bend_compat.mixins.json').decode()
              assert 'assets/lyriusrpmodplugin/textures/gui/title/lyrius.png' in names
              assert 'assets/minecraft/textures/gui/title/mojangstudios.png' in names
              assert 'assets/minecraft/textures/gui/sprites/hud/experience_bar_progress.png' in names
          print('Regression gates: PASS')
          PY

      - name: Documentation and hashes
        shell: bash
        run: |
          set -euo pipefail
          cp Patcher.java dist/source/Patcher-1.0.137.java
          cp .github/workflows/lyrius-137-final-build.yml dist/source/BUILD-WORKFLOW-1.0.137.yml
          cat > dist/docs/DIAGNOSTICO.md <<'EOF'
          # Diagnóstico 1.0.137
          - 1.0.136 carregava GenericContainerScreenMixin inexistente em lyriusclient.client.mixins.json.
